name: Access release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Retry an unpublished version committed on main: access-vMAJOR.MINOR.PATCH'
        type: string
        required: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: access-release-main
  cancel-in-progress: false
  queue: max

jobs:
  classify:
    if: github.repository == 'hemia-labs/access' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.batch.outputs.release }}
      tag: ${{ steps.batch.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify an Access version-only merge
        id: batch
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            node scripts/access-version.mjs retry "$REQUESTED_TAG"
          else
            node scripts/access-version.mjs classify "$BASE_SHA"
          fi

  version-pr:
    needs: [classify, checks]
    if: needs.classify.outputs.release != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Find pending Access changesets
        id: changesets
        run: |
          node scripts/access-version.mjs pending
      - name: Create a GitHub App token when configured
        id: app-token
        if: steps.changesets.outputs.pending == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: access
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the Access version PR
        if: steps.changesets.outputs.pending == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1 for CLI 2
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          version: bun run version:access
          title: 'chore(access): release application version'
          commit: 'chore(access): release application version'
          commitMode: github-api
          createGithubReleases: false

  checks:
    needs: classify
    if: needs.classify.outputs.release != 'true'
    uses: ./.github/workflows/access-ci.yml

  publish:
    needs: [classify, checks]
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.release == 'true' }}
    environment: prod
    outputs:
      release_tag: ${{ needs.classify.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Test Access and its production images
        run: bash scripts/access-checks.sh
      - name: Join Tailscale with GitHub OIDC
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:hemia-ci
      - name: Publish images and immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.classify.outputs.tag }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Redeploy its assets instead of rebuilding.' >&2
            exit 1
          fi
          : "${REGISTRY_HOST:?Missing REGISTRY_HOST}" "${REGISTRY_USERNAME:?Missing REGISTRY_USERNAME}" "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD}"
          export DOCKER_CONFIG="$RUNNER_TEMP/access-registry-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          trap 'docker logout "$REGISTRY_HOST" >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin
          for service in api web; do
            image="$REGISTRY_HOST/access/$service:$RELEASE_TAG"
            docker tag "hemia-access-$service:local" "$image"
            docker push "$image"
            docker manifest inspect "$image" >/dev/null
          done
          python3 scripts/access-release.py create "$RELEASE_TAG" "$RUNNER_TEMP/access-release"
          node scripts/access-version.mjs notes > "$RUNNER_TEMP/access-release-notes.md"
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
            --title "Access ${RELEASE_TAG#access-v}" --notes-file "$RUNNER_TEMP/access-release-notes.md"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/access-release/"*
          gh release edit "$RELEASE_TAG" --draft=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq 'if .immutable != true then error("Enable release immutability before publishing Access releases") else .tag_name end'
          echo "Release ready: $RELEASE_TAG. The next job checks whether automatic deployment is enabled in prod." >> "$GITHUB_STEP_SUMMARY"

  auto-deploy:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      operation: deploy
      release_tag: ${{ needs.publish.outputs.release_tag }}
      automatic: true
    secrets: inherit
